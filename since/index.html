<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Since</title>
<meta name="description" content="Days-since timers with penalties instead of resets.">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Since">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --surface2: #efede8;
  --ink: #1b1b1f; --ink2: #55555f; --muted: #85858f; --line: #e4e2dc;
  --accent: #17805f; --accent-ink: #ffffff; --accent-soft: rgba(23,128,95,.12);
  --danger: #c93a2e; --danger-soft: rgba(201,58,46,.10);
  --gold: #a8740a; --gold-soft: rgba(200,140,10,.14);
  --wave: #2f6fd6; --wave-soft: rgba(47,111,214,.12);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1012; --surface: #1a1b1f; --surface2: #24252a;
    --ink: #f2f2f4; --ink2: #b4b4bd; --muted: #7e7e89; --line: #2c2d33;
    --accent: #4cc9a0; --accent-ink: #06231a; --accent-soft: rgba(76,201,160,.14);
    --danger: #ff6b5e; --danger-soft: rgba(255,107,94,.13);
    --gold: #f0c050; --gold-soft: rgba(240,192,80,.14);
    --wave: #6aa8ff; --wave-soft: rgba(106,168,255,.15);
    --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  min-height: 100vh; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }
.num { font-variant-numeric: tabular-nums; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 0 10px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.bar h1 { font-size: 28px; letter-spacing: -.02em; margin: 0; }
.bar h2 { font-size: 17px; margin: 0; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink2); }
.icon-btn:active { background: var(--surface2); }
.icon-btn.primary { background: var(--accent); color: var(--accent-ink); }
.icon-btn svg { width: 22px; height: 22px; }
.bar .right { display: flex; gap: 6px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.timer-card { cursor: pointer; }
.card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card-top h3 { margin: 0; font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { font-size: 12px; color: var(--muted); white-space: nowrap; }
.section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
.link-btn { color: var(--accent); font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; padding: 4px 0; }

/* clock */
.clock { display: flex; align-items: baseline; gap: 2px 10px; flex-wrap: wrap; margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
.clock .seg { white-space: nowrap; }
.clock b { font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
.clock small { font-size: 15px; color: var(--muted); margin-left: 1px; font-weight: 500; }
.clock.big { justify-content: center; margin: 4px 0 6px; }
.clock.big { flex-wrap: nowrap; gap: 8px; }
.clock.big b { font-size: clamp(34px, 11vw, 52px); }
.clock.big .seg:last-child b { font-size: clamp(22px, 6.5vw, 30px); color: var(--ink2); }
.clock.big small { font-size: 18px; }
.clock.neg b, .clock.neg .sign { color: var(--danger); }
.clock .sign { font-size: 34px; font-weight: 700; margin-right: -6px; }
.clock.big .sign { font-size: clamp(34px, 11vw, 52px); }
.sub { color: var(--ink2); font-size: 14px; }
.hero { text-align: center; padding: 22px 16px 18px; }
.hero .sub { margin-bottom: 14px; }

/* progress */
.progress { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin: 12px 0 6px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s; }
.next { font-size: 13px; color: var(--muted); }

/* slip button */
.slip-btn { width: 100%; margin-top: 14px; padding: 13px; border-radius: 14px; background: var(--danger-soft); color: var(--danger); font-weight: 650; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.slip-btn:active { transform: scale(.98); }
.slip-btn.lg { padding: 16px; font-size: 17px; }

/* stats */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface2); border-radius: 12px; padding: 12px; min-width: 0; }
.stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat .k { font-size: 12px; color: var(--muted); margin-top: 2px; }
.stat .d { font-size: 12px; color: var(--ink2); margin-top: 4px; }

/* milestones */
.ms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.ms { border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; font-size: 13px; color: var(--muted); }
.ms .e { font-size: 20px; display: block; filter: grayscale(1); opacity: .45; }
.ms.done { color: var(--ink); border-color: transparent; background: var(--accent-soft); }
.ms.done .e { filter: none; opacity: 1; }
.ms.next { border-style: dashed; border-color: var(--accent); color: var(--ink2); }

/* history */
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
.hist li:first-child { border-top: 0; padding-top: 0; }
.hist .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); margin-top: 6px; flex: none; }
.hist .when { font-size: 15px; }
.hist .note { font-size: 14px; color: var(--ink2); margin-top: 2px; word-break: break-word; }
.hist .pen { margin-left: auto; color: var(--danger); font-weight: 600; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.empty-hist { color: var(--muted); font-size: 14px; }

/* chart */
.seg-ctl { display: inline-flex; background: var(--surface2); border-radius: 10px; padding: 2px; }
.seg-ctl button { padding: 5px 11px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink2); text-transform: none; letter-spacing: 0; }
.seg-ctl button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.chart-wrap { position: relative; touch-action: pan-y; }
.chart-wrap svg { display: block; width: 100%; overflow: visible; }
.chart-wrap .axis { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart-wrap .grid { stroke: var(--line); stroke-width: 1; }
.chart-wrap .zero { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
.chart-wrap .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.chart-wrap .area { fill: var(--accent-soft); }
.chart-wrap .slipdot { fill: var(--danger); stroke: var(--surface); stroke-width: 2; }
.chart-wrap .xh { stroke: var(--ink2); stroke-width: 1; }
.chart-wrap .hdot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.35; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translateX(-50%); opacity: 0; transition: opacity .12s; max-width: 240px; }
.tip.show { opacity: 1; }
.tip b { font-weight: 700; }
.chart-empty { color: var(--muted); font-size: 14px; padding: 30px 0; text-align: center; }

/* empty state */
.empty { text-align: center; padding: 64px 20px; color: var(--ink2); }
.empty .big { font-size: 48px; margin-bottom: 8px; }
.empty h2 { color: var(--ink); margin: 0 0 6px; font-size: 22px; }
.btn { padding: 13px 18px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 650; }
.btn.secondary { background: var(--surface2); color: var(--ink); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.block { width: 100%; }
.empty .btn { margin-top: 20px; }

/* sheet */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .18s; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; animation: up .24s cubic-bezier(.2,.9,.3,1); }
@media (min-width: 600px) { .backdrop { align-items: center; } .sheet { border-radius: 22px; padding-bottom: 20px; } }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet h3 { margin: 0 0 16px; font-size: 20px; }
.field { display: block; margin-bottom: 14px; }
.field span { display: block; font-size: 13px; color: var(--ink2); margin-bottom: 6px; font-weight: 500; }
.field input, .field textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; min-height: 46px; }
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.quick button { padding: 6px 12px; border-radius: 99px; background: var(--surface2); font-size: 14px; }
.quick button.on { background: var(--accent); color: var(--accent-ink); }
.row { display: flex; gap: 10px; margin-top: 8px; }
.row > * { flex: 1; }
.stack > * + * { margin-top: 10px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 6px; z-index: 60; box-shadow: 0 8px 30px rgba(0,0,0,.25); max-width: calc(100vw - 32px); animation: up .22s; font-size: 15px; }
.toast .msg { margin-right: 6px; white-space: nowrap; }
.toast { width: max-content; }
.toast button { color: var(--bg); font-weight: 700; padding: 6px 10px; border-radius: 8px; background: rgba(127,127,127,.25); white-space: nowrap; font-size: 14px; }

/* celebration */
.celebrate { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(0,0,0,.55); animation: fade .2s; padding: 16px; }
.celebrate .box { background: var(--surface); border-radius: 24px; padding: 28px 24px; text-align: center; max-width: 340px; width: 100%; animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
.celebrate .e { font-size: 64px; }
.celebrate h3 { margin: 8px 0 4px; font-size: 24px; }
.celebrate p { color: var(--ink2); margin: 0 0 20px; }
.confetti { position: fixed; top: -12px; width: 8px; height: 14px; border-radius: 2px; z-index: 71; pointer-events: none; animation: fall linear forwards; }

/* action buttons */
.btn-row { display: flex; gap: 8px; margin-top: 14px; }
.btn-row .slip-btn, .btn-row .wave-btn { margin-top: 0; flex: 1; }
.wave-btn { padding: 13px 8px; border-radius: 14px; background: var(--wave-soft); color: var(--wave); font-weight: 650; font-size: 15px; }
.slip-btn { font-size: 15px; padding: 13px 8px; }
.wave-btn.lg, .slip-btn.lg { padding: 16px 8px; font-size: 16px; }
.wave-btn:active { transform: scale(.98); }
.btn.ghost { background: transparent; border: 1px solid var(--danger-soft); }
.big-btn { padding: 16px; font-size: 17px; }
.install { font-size: 14px; color: var(--ink2); line-height: 1.5; }
.install .link-btn { display: block; margin-top: 4px; }

/* reflections */
.reflect-pill { display: block; width: 100%; text-align: left; margin-top: 12px; padding: 9px 12px; border-radius: 10px; background: var(--gold-soft); color: var(--ink); font-size: 14px; }
.reflect-card { border-color: var(--gold); }
.reflect-card .row { margin-top: 12px; }
.expect { margin-top: 10px; padding: 10px 12px; background: var(--surface2); border-radius: 10px; font-size: 14px; color: var(--ink); }
.expect span { color: var(--muted); display: block; font-size: 12px; margin-bottom: 2px; }
.worth { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; vertical-align: 1px; }
.worth.no { background: var(--danger-soft); color: var(--danger); }
.worth.meh { background: var(--surface2); color: var(--ink2); }
.worth.yes { background: var(--gold-soft); color: var(--gold); }
.stat.wide { grid-column: 1 / -1; }
.stat .of { font-size: 14px; color: var(--muted); font-weight: 600; }

/* legend & chart extras */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.lg-slip { background: var(--danger); }
.lg-wave { background: var(--surface); border: 2px solid var(--wave); }
.lg-line { width: 14px !important; height: 2px !important; border-radius: 1px !important; background: var(--accent); }
.lg-clean { background: var(--accent-soft); border-radius: 3px !important; }
.chart-wrap .wavedot { fill: var(--surface); stroke: var(--wave); stroke-width: 2.5; }
.hist .dot.wave { background: var(--wave); }
.hist .pen.ok { color: var(--wave); }

/* calendar */
.cal-nav { display: inline-flex; gap: 2px; }
.icon-btn.sm { width: 32px; height: 32px; border-radius: 9px; }
.icon-btn.sm svg { width: 18px; height: 18px; }
.icon-btn.flip svg { transform: scaleX(-1); }
.cal-title { font-weight: 650; margin: -4px 0 10px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-wd { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; padding-bottom: 2px; }
.cal-cell { aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; padding: 0; min-width: 0; position: relative; }
.cal-cell.pad { visibility: hidden; }
.cal-cell.off { color: var(--muted); opacity: .45; }
.cal-cell.clean { background: var(--accent-soft); }
.cal-cell.slipped { background: var(--danger-soft); }
.cal-cell.today { outline: 2px solid var(--ink); outline-offset: -2px; }
.cal-cell .dn { font-variant-numeric: tabular-nums; font-weight: 500; line-height: 1; }
.cal-cell .marks { display: flex; gap: 2px; align-items: center; height: 10px; }
.cal-cell .marks i { font-style: normal; }
.m-slip { min-width: 8px; height: 8px; border-radius: 99px; background: var(--danger); color: #fff; font-size: 8px; line-height: 8px; font-weight: 700; padding: 0 2px; text-align: center; }
.m-wave { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--wave); }
.m-note { font-size: 8px; line-height: 1; }
button.cal-cell:active { transform: scale(.94); }
.day-entry { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.de-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.de-head .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
.de-head .dot.wave { background: var(--wave); }
.de-head .pen { margin-left: auto; color: var(--danger); font-weight: 600; font-size: 14px; }
.de-row { font-size: 14px; padding: 5px 0; border-top: 1px solid var(--line); word-break: break-word; }
.de-row > span:first-child { display: block; font-size: 12px; color: var(--muted); }
.de-row em { color: var(--muted); }

/* ride the wave */
.wave-screen { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); animation: fade .2s; }
.wave-screen .bar, .wave-body { max-width: 560px; margin: 0 auto; }
.wave-body .lead { font-size: 17px; color: var(--ink2); margin: 4px 0 16px; line-height: 1.5; }
.rating { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.rating button { aspect-ratio: 1; border-radius: 9px; background: var(--surface2); font-weight: 650; font-size: 14px; padding: 0; }
.rating button.on { background: var(--wave); color: #fff; }
.rating-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }
.ring-wrap { position: relative; width: 240px; height: 240px; margin: 8px auto 18px; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface2); stroke-width: 10; }
.ring-fg { fill: none; stroke: var(--wave); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
.breath { position: absolute; inset: 26px; display: grid; place-items: center; }
.bubble { width: 100%; height: 100%; border-radius: 50%; background: var(--wave-soft); animation: breathe 10s ease-in-out infinite; }
.ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.count { font-size: 46px; font-weight: 700; letter-spacing: -.02em; }
.breath-txt { color: var(--ink2); font-size: 15px; }
@keyframes breathe { 0% { transform: scale(.72) } 40% { transform: scale(1) } 100% { transform: scale(.72) } }
.msg-card .msg { font-size: 17px; line-height: 1.5; font-style: italic; }
.wtip { font-size: 15px; line-height: 1.5; min-height: 3em; }
.alts { list-style: none; margin: 0; padding: 0; }
.alts li + li { border-top: 1px solid var(--line); }
.alts label { display: flex; gap: 12px; align-items: center; padding: 11px 0; cursor: pointer; }
.alts input { width: 22px; height: 22px; accent-color: var(--wave); flex: none; }
.alts input:checked + span { text-decoration: line-through; color: var(--muted); }
.done-hero { text-align: center; padding: 20px 0 12px; }
.done-hero .e { font-size: 56px; }
.done-hero h3 { margin: 6px 0; font-size: 22px; }

@keyframes fade { from { opacity: 0 } }
@keyframes up { from { transform: translate(var(--tx, 0), 30px); opacity: 0 } }
.toast { --tx: -50%; }
@keyframes pop { from { transform: scale(.7); opacity: 0 } }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script src="app.js"></script>
</body>
</html>
